name: agrotech
description: "Wakshe Agrotech (वाक्षे ॲग्रोटेक) - Handcrafted agricultural tools catalog & inventory app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  url_launcher: ^6.3.1

  # --- Future Cloud & Backend integrations (Firebase / Cloud Storage / Auth) ---
  # firebase_core: ^3.12.0
  # cloud_firestore: ^5.6.3
  # firebase_storage: ^12.4.1
  # firebase_auth: ^5.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/app_logo.png
    - assets/
